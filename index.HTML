<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cek KBBI</title>

<style>
body{
  font-family: Arial;
  background:#f1f5f9;
  padding:40px;
}
.box{
  background:white;
  padding:20px;
  max-width:600px;
  margin:auto;
  border-radius:10px;
}
textarea{
  width:100%;
  height:120px;
}
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  font-size:16px;
}
.salah{ color:red; }
.benar{ color:green; }
</style>
</head>

<body>

<div class="box">
<h2>Cek Kata Baku (KBBI Mini)</h2>

<textarea id="input" placeholder="contoh: aku ga tau knp bljr"></textarea>
<button onclick="cek()">CEK</button>

<div id="hasil"></div>
</div>

<script>
// KAMUS (BISA DIPERBANYAK)
const kamus = [
  "aku","saya","tidak","tahu","kenapa","belajar",
  "mengapa","karena","bahasa","indonesia","makan",
  "minum","pergi","pulang","rumah","sekolah"
];

function cek(){
  let teks = input.value.toLowerCase();
  let kata = teks.replace(/[^a-z\s]/g,"").split(" ");
  let hasil = "";

  kata.forEach(k=>{
    if(k){
      if(kamus.includes(k)){
        hasil += `<p class="benar">✔ ${k}</p>`;
      }else{
        hasil += `<p class="salah">❌ ${k} (tidak baku)</p>`;
      }
    }
  });

  document.getElementById("hasil").innerHTML = hasil;
}
</script>

</body>
</html>
